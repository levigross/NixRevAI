name: nix-ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  flake-eval:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@da36cb69b1c3247ad7a1f931ebfd954a1105ef14 # v14

      - name: Show flake outputs
        run: nix flake show --no-write-lock-file

      - name: Evaluate flake checks
        run: nix flake check --no-build --no-write-lock-file

      - name: Evaluate default devShell drvPath
        run: nix eval --raw .#devShells.x86_64-linux.default.inputDerivation.drvPath

      - name: Check Nix formatting (alejandra)
        run: nix run .#formatter.x86_64-linux -- --check .

  unit-tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@da36cb69b1c3247ad7a1f931ebfd954a1105ef14 # v14

      - name: Run devShell unit tests
        run: nix develop -c bash tests/unit/devshell_unit.sh
